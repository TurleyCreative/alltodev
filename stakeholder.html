<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stakeholder · Consultation Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300;background:#fff;color:#20242b;min-height:100vh;-webkit-font-smoothing:antialiased}
header{max-width:820px;margin:0 auto;padding:44px 24px 12px}
.sh-back{font-size:12px;font-weight:500;color:#8b909b;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.sh-back:hover{color:#5b616b}

.sh-profile{max-width:820px;margin:0 auto;padding:16px 24px 0}
.sh-card{background:#f2f3f5;border-radius:24px;padding:30px 32px}
.sh-name{font-size:24px;font-weight:500;letter-spacing:-.01em}
.sh-org{font-size:14px;font-weight:400;color:#5b616b;margin-top:4px}
.sh-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.sh-tag{font-size:11px;font-weight:600;padding:5px 12px;border-radius:100px;background:#fff;color:#3a3f47}
.sh-tag-priority.high{color:#c0392b}
.sh-tag-priority.medium{color:#b8860b}
.sh-tag-priority.low{color:#5b616b}
.sh-owner{font-size:12px;color:#8b909b;margin-top:14px}

.sh-section{max-width:820px;margin:0 auto;padding:32px 24px 0}
.sh-section:last-child{padding-bottom:56px}
.sh-section-title{font-size:16px;font-weight:500;margin-bottom:14px}
.sh-feed{display:flex;flex-direction:column;gap:10px}
.sh-entry{background:#f2f3f5;border-radius:16px;padding:18px 22px;cursor:pointer}
.sh-entry-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sh-entry-type{font-size:11px;font-weight:600;padding:4px 10px;border-radius:100px;background:#fff;color:#3a3f47}
.sh-entry-date{font-size:12px;color:#8b909b}
.sh-entry-summary{font-size:13px;font-weight:400;color:#3a3f47;margin-top:10px;line-height:1.5}
.sh-entry-notes{font-size:13px;font-weight:400;color:#3a3f47;margin-top:10px;line-height:1.6;display:none}
.sh-entry-notes.open{display:block}
.sh-entry-notes p{margin-bottom:8px}
.sh-entry-notes ul,.sh-entry-notes ol{margin:0 0 8px 20px}
.sh-entry-toggle{font-size:11px;font-weight:600;color:#3a8f6f;margin-top:10px;display:inline-block}
.sh-entry-foot{font-size:11px;color:#8b909b;margin-top:10px}
.sh-empty{font-size:13px;color:#8b909b;background:#f2f3f5;border-radius:16px;padding:22px;text-align:center}

.sh-form{background:#f2f3f5;border-radius:24px;padding:28px 30px}
.sh-form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
.sh-form input,.sh-form select{font-family:inherit;font-size:13px;padding:10px 12px;border:1px solid #dcdfe3;border-radius:10px;background:#fff;color:#20242b;width:100%}
.sh-rte-toolbar{display:flex;gap:6px;margin-bottom:6px}
.sh-rte-btn{border:1px solid #dcdfe3;background:#fff;border-radius:8px;width:30px;height:30px;font-size:13px;font-weight:600;cursor:pointer;color:#3a3f47}
.sh-rte-btn:hover{background:#e9ebee}
.sh-rte-input{min-height:110px;background:#fff;border:1px solid #dcdfe3;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6;margin-bottom:14px}
.sh-rte-input:empty:before{content:attr(data-placeholder);color:#8b909b}
.sh-form-submit{border:none;background:#20242b;color:#fff;font-family:inherit;font-size:13px;font-weight:500;padding:11px 22px;border-radius:100px;cursor:pointer}
.sh-form-submit:hover{background:#3a3f47}
.sh-form-status{font-size:12px;color:#8b909b;margin-top:10px}
.sh-form-status.err{color:#c0392b}
.sh-form-status.ok{color:#2f6f52}
@media(max-width:560px){.sh-form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <a class="sh-back" href="hub.html">&larr; Back to hub</a>
</header>

<div class="sh-profile">
  <div class="sh-card">
    <div class="sh-name" id="sh-name">&mdash;</div>
    <div class="sh-org" id="sh-org"></div>
    <div class="sh-meta">
      <span class="sh-tag" id="sh-type"></span>
      <span class="sh-tag sh-tag-priority" id="sh-priority"></span>
    </div>
    <div class="sh-owner" id="sh-owner"></div>
  </div>
</div>

<div class="sh-section">
  <div class="sh-section-title">Add entry</div>
  <div class="sh-form">
    <form id="sh-add-form">
      <div class="sh-form-row">
        <select id="entry-type" required>
          <option value="">Type…</option>
          <option>Meeting</option>
          <option>Call</option>
          <option>Email</option>
          <option>Letter</option>
          <option>Leaflet Drop</option>
          <option>Site Visit</option>
          <option>Event</option>
          <option>Other</option>
        </select>
        <input type="date" id="entry-date" required/>
        <input type="date" id="entry-followup"/>
      </div>
      <div class="sh-form-row" style="grid-template-columns:1fr">
        <input type="text" id="entry-loggedby" placeholder="Logged by" required/>
      </div>
      <div class="sh-rte-toolbar">
        <button type="button" class="sh-rte-btn" data-cmd="bold"><b>B</b></button>
        <button type="button" class="sh-rte-btn" data-cmd="italic"><i>I</i></button>
        <button type="button" class="sh-rte-btn" data-cmd="insertUnorderedList">&#8226;</button>
      </div>
      <div class="sh-rte-input" id="entry-notes" contenteditable="true" data-placeholder="Notes…"></div>
      <button class="sh-form-submit" type="submit">Add entry</button>
      <div class="sh-form-status" id="sh-form-status"></div>
    </form>
  </div>
</div>

<div class="sh-section">
  <div class="sh-section-title">Activity</div>
  <div class="sh-feed" id="sh-feed"><div class="sh-empty">Loading…</div></div>
</div>

<script>
// Same EngagementLog read flow used across the hub. Expects stakeholderId
// in the query string, returns SharePoint's raw item shape per entry.
var ENGAGEMENTLOG_URL = "https://default8f1dd42696094019b47568f7400a1c.8a.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/07/workflows/25d74467bf0146499edf231cbf72f8aa/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=f57Z8mWPQJdyfTU3y7kRNiLlJBvKirrBJ9DCt_6QdXI";

// Set once the EngagementLog write flow is built: accepts a POST with
// {stakeholderId, enType, date, followUp, loggedBy, notes(html)}.
var ENGAGEMENTLOG_WRITE_URL = "";

function qparam(name){
  return new URLSearchParams(window.location.search).get(name) || "";
}

function loadProfile(){
  document.getElementById("sh-name").textContent = qparam("name") || "Unnamed stakeholder";
  document.getElementById("sh-org").textContent = qparam("organisation");
  document.getElementById("sh-type").textContent = qparam("shType");
  var priority = qparam("priority");
  var prEl = document.getElementById("sh-priority");
  prEl.textContent = priority;
  prEl.className = "sh-tag sh-tag-priority " + priority.toLowerCase();
  var owner = qparam("owner");
  document.getElementById("sh-owner").textContent = owner ? "Owned by " + owner : "";
  var dateEl = document.getElementById("entry-date");
  if(dateEl && !dateEl.value) dateEl.value = new Date().toISOString().slice(0,10);
}

// SharePoint returns Lookup columns as {..., Value:"X"} and Person
// columns as {..., DisplayName:"X"} rather than plain text — unwrap both.
function pickValue(v){
  if(v && typeof v === "object"){
    if("Value" in v) return v.Value;
    if("DisplayName" in v) return v.DisplayName;
  }
  return v;
}

function fmtDate(s){
  if(!s) return "";
  var d = new Date(s);
  if(isNaN(d.getTime())) return s;
  return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
}

function stripHtml(html){
  var div = document.createElement("div");
  div.innerHTML = html || "";
  return (div.textContent || "").trim();
}
function truncate(s, n){ return s.length > n ? s.slice(0,n).trim()+"…" : s; }

// Only allow a small set of formatting tags through, with no attributes —
// strips anything else (scripts, images, links, inline styles/handlers)
// whether it came from our own editor or was written directly in SharePoint.
var RTE_ALLOWED_TAGS = {B:1,STRONG:1,I:1,EM:1,U:1,UL:1,OL:1,LI:1,BR:1,P:1,DIV:1};
function sanitizeHtml(html){
  var container = document.createElement("div");
  container.innerHTML = html || "";
  (function clean(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(child){
      if(child.nodeType === 1){
        if(!RTE_ALLOWED_TAGS[child.tagName]){
          node.replaceChild(document.createTextNode(child.textContent), child);
        } else {
          Array.prototype.slice.call(child.attributes).forEach(function(attr){ child.removeAttribute(attr.name); });
          clean(child);
        }
      } else if(child.nodeType !== 3){
        node.removeChild(child);
      }
    });
  })(container);
  return container.innerHTML;
}

function loadActivity(){
  var id = qparam("id");
  var feedEl = document.getElementById("sh-feed");
  if(!id){ feedEl.innerHTML = "<div class=\"sh-empty\">No stakeholder selected.</div>"; return; }
  if(!ENGAGEMENTLOG_URL){ feedEl.innerHTML = "<div class=\"sh-empty\">Connect the EngagementLog read flow to show activity here.</div>"; return; }
  var sep = ENGAGEMENTLOG_URL.indexOf("?")===-1 ? "?" : "&";
  fetch(ENGAGEMENTLOG_URL + sep + "stakeholderId=" + encodeURIComponent(id))
    .then(function(r){ return r.json(); })
    .then(function(rows){
      if(!Array.isArray(rows)) throw new Error();
      if(!rows.length){ feedEl.innerHTML = "<div class=\"sh-empty\">No activity logged yet.</div>"; return; }
      rows.sort(function(a,b){ return new Date(b.Date) - new Date(a.Date); });
      feedEl.innerHTML = rows.map(function(r, i){
        var enType = pickValue(r.enType);
        var loggedBy = pickValue(r.loggedBy);
        var followUp = r.Follow_x002d_upDate;
        var notesHtml = sanitizeHtml(r.Notes || "");
        var summary = truncate(stripHtml(notesHtml), 120);
        var needsToggle = stripHtml(notesHtml).length > 120;
        return "<div class=\"sh-entry\" data-entry=\""+i+"\">"
          + "<div class=\"sh-entry-head\"><span class=\"sh-entry-type\">"+(enType||"")+"</span><span class=\"sh-entry-date\">"+fmtDate(r.Date)+"</span></div>"
          + (summary ? "<div class=\"sh-entry-summary\">"+summary+"</div>" : "")
          + "<div class=\"sh-entry-notes\" id=\"sh-entry-notes-"+i+"\">"+notesHtml+"</div>"
          + (needsToggle ? "<span class=\"sh-entry-toggle\" id=\"sh-entry-toggle-"+i+"\">Show full note</span>" : "")
          + "<div class=\"sh-entry-foot\">Logged by "+(loggedBy||"—")+(followUp ? " · Follow up "+fmtDate(followUp) : "")+"</div>"
          + "</div>";
      }).join("");
      feedEl.querySelectorAll(".sh-entry").forEach(function(entryEl){
        entryEl.addEventListener("click", function(){
          var i = entryEl.getAttribute("data-entry");
          var notesEl = document.getElementById("sh-entry-notes-"+i);
          var toggleEl = document.getElementById("sh-entry-toggle-"+i);
          if(!notesEl || !toggleEl) return;
          var open = notesEl.classList.toggle("open");
          toggleEl.textContent = open ? "Show summary" : "Show full note";
        });
      });
    })
    .catch(function(){ feedEl.innerHTML = "<div class=\"sh-empty\">Could not load activity.</div>"; });
}

document.querySelectorAll(".sh-rte-btn").forEach(function(btn){
  btn.addEventListener("click", function(){
    document.execCommand(btn.getAttribute("data-cmd"), false, null);
    document.getElementById("entry-notes").focus();
  });
});

document.getElementById("sh-add-form").addEventListener("submit", function(e){
  e.preventDefault();
  var statusEl = document.getElementById("sh-form-status");
  var id = qparam("id");
  var payload = {
    stakeholderId: id,
    enType: document.getElementById("entry-type").value,
    date: document.getElementById("entry-date").value,
    followUp: document.getElementById("entry-followup").value || null,
    loggedBy: document.getElementById("entry-loggedby").value,
    notes: sanitizeHtml(document.getElementById("entry-notes").innerHTML)
  };
  if(!payload.enType || !payload.date || !payload.loggedBy){
    statusEl.textContent = "Fill in type, date and logged by first.";
    statusEl.className = "sh-form-status err";
    return;
  }
  if(!ENGAGEMENTLOG_WRITE_URL){
    statusEl.textContent = "Write flow isn’t connected yet — nothing saved.";
    statusEl.className = "sh-form-status err";
    return;
  }
  statusEl.textContent = "Saving…";
  statusEl.className = "sh-form-status";
  fetch(ENGAGEMENTLOG_WRITE_URL, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  }).then(function(r){
    if(!r.ok) throw new Error();
    statusEl.textContent = "Entry added.";
    statusEl.className = "sh-form-status ok";
    document.getElementById("sh-add-form").reset();
    document.getElementById("entry-notes").innerHTML = "";
    loadProfile();
    loadActivity();
  }).catch(function(){
    statusEl.textContent = "Could not save — try again.";
    statusEl.className = "sh-form-status err";
  });
});

loadProfile();
loadActivity();
</script>
</body>
</html>
